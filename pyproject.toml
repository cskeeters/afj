[project]
name = "avt"
version = "0.1.0"
description = "Outputs the values of a form in a PDF file"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.14.2",
]

[project.scripts]
avt = "avt:main"

# Helpers for uv
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
